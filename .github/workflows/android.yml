name: Android checks

on:
  push:
    branches: [only-for-android]
  pull_request:
    branches: [only-for-android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Original source guard (no Git-history requirement)
        run: node --test tests/minimal-baseline.test.mjs
      - name: JVM tests, keyless APK builds and Lint
        working-directory: android
        run: >-
          ./gradlew --no-daemon -Pkotlin.incremental=false
          :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          :app:assembleDebugAndroidTest :app:lintDebug
      - name: Packaged original OpenCV and C++ runtime guard
        run: node --test tests/native-apk.test.mjs
      - name: Publish reports only (never APKs or local configuration)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
